name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint imports
        run: python -c "from src.data import DiabetesDataLoader; from src.model import create_model; from src.privacy import PrivacyManager"

      - name: Run smoke tests
        run: pytest tests/ -v --tb=short

      - name: Centralized training smoke test
        run: python train_centralized.py --epochs 2

      - name: Verify data pipeline
        run: python -c "from src.data import DiabetesDataLoader; d=DiabetesDataLoader(); df=d.load_diabetes_data(); assert len(df)==768"
