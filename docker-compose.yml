services:
  server:
    build: .
    container_name: fl-server
    command: python server.py --rounds 5 --min-clients 3
    ports:
      - "8080:8080"
    environment:
      - FL_SERVER_ADDRESS=0.0.0.0:8080
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results
      - ./logs:/app/logs
    networks:
      - fl-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('127.0.0.1',8080))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  client1:
    build: .
    container_name: fl-client1
    command: python client.py 1 --hospital hospital_1 --server server:8080
    depends_on:
      server:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    networks:
      - fl-network

  client2:
    build: .
    container_name: fl-client2
    command: python client.py 2 --hospital hospital_2 --server server:8080
    depends_on:
      server:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    networks:
      - fl-network

  client3:
    build: .
    container_name: fl-client3
    command: python client.py 3 --hospital hospital_3 --server server:8080
    depends_on:
      server:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    networks:
      - fl-network

  api:
    build: .
    container_name: fl-api
    command: python api.py --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    depends_on:
      - server
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - fl-network

networks:
  fl-network:
    driver: bridge
